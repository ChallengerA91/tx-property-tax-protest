name: Tests

# Runs the pytest suite for the package-building scripts. No network access is
# needed: the scripts hold no law and read only the case.json they are given.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: skills/tx-property-tax-protest/scripts/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r skills/tx-property-tax-protest/scripts/requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
